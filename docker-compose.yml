version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: clynicx_db
    restart: always
    environment:
      POSTGRES_USER: clynicx_user
      POSTGRES_PASSWORD: clynicx_password
      POSTGRES_DB: clynicx
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build:
      context: ./backend
    container_name: clynicx_backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=clynicx
      - DB_USER=clynicx_user
      - DB_PASSWORD=clynicx_password
      - PORT=3001
      - FRONTEND_URL=http://localhost:5173
      - JWT_SECRET=super_secret_jwt_key_here
    depends_on:
      - db
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
    container_name: clynicx_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3001
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
