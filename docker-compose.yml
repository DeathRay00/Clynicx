version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg15
    container_name: clynicx_db
    restart: always
    environment:
      POSTGRES_USER: clynicx_user
      POSTGRES_PASSWORD: clynicx_password
      POSTGRES_DB: clynicx
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./backend/schema_chatbot.sql:/docker-entrypoint-initdb.d/02_chatbot.sql

  backend:
    build:
      context: ./backend
    container_name: clynicx_backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=clynicx
      - DB_USER=clynicx_user
      - DB_PASSWORD=clynicx_password
      - PORT=3001
      - FRONTEND_URL=http://localhost:5173
    depends_on:
      - db
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 3001 --reload

  frontend:
    build:
      context: ./frontend
    container_name: clynicx_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3001
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
